name: Daily IT News Agent

on:
  schedule:
    - cron: '0 23 * * *'  # 毎日8:00 JST（UTC 23:00）
  workflow_dispatch:        # 手動実行ボタンも追加

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリインストール
        run: |
          pip install requests beautifulsoup4 pandas openpyxl \
                      google-generativeai langgraph langchain-google-genai \
                      lxml

      - name: エージェント実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python news_agent.py

      - name: CSVとレポートを保存
        uses: actions/upload-artifact@v4
        with:
          　name: news-files
          　path: |
            　news_*.csv
            　report_*.txt
          　retention-days: 30
